version: '3.8'

services:
  newsletter:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: custom-newsletter
    env_file:
      - .env
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - CLIENT_ID=${CLIENT_ID}
      - TENANT_ID=${TENANT_ID}
      - CLIENT_SECRET=${CLIENT_SECRET}
      - SENDER_EMAIL=${SENDER_EMAIL}
      - RECIPIENT_EMAIL=${RECIPIENT_EMAIL}
      - OLLAMA_HOST=${OLLAMA_HOST:-http://ollama:11434}
      - CRON_SCHEDULE=${CRON_SCHEDULE:-0 6 * * *}
    volumes:
      - .:/app
    networks:
      - newsletter-network
    restart: unless-stopped

  ollama:
    volumes:
      - ./ollama:/root/.ollama
    container_name: ollama
    pull_policy: always
    tty: true
    restart: unless-stopped
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - newsletter-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  ollama-pull-model:
    image: curlimages/curl:latest
    container_name: ollama-pull-model
    volumes:
      - ./ollama:/root/.ollama
    command: >
      sh -c 'curl -X POST http://ollama:11434/api/pull -d "{\"name\": \"qwen3.5:4b\"}" && 
         curl -X POST http://ollama:11434/api/pull -d "{\"name\": \"gemma4:e4b\"}"'
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - newsletter-network

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "3000:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - WEBUI_SECRET_KEY=super-secret-key-123
    volumes:
      - ./open-webui:/app/backend/data
    depends_on:
      - ollama
    networks:
      - newsletter-network

networks:
  newsletter-network:
    driver: bridge

volumes:
  ollama-data:
